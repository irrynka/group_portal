<!DOCTYPE html>
<html>
<head>
    <title>Profile</title>
</head>
<body>

<h1>User Profile</h1>

{% if user.is_authenticated %}
    <p>Username: {{ user.username }}</p>
    <p>First name: {{ user.first_name }}</p>
    <p>Last name: {{ user.last_name }}</p>
    <p>Email: {{ user.email }}</p>
{% else %}
    <p>You are not logged in.</p>
{% endif %}

</body>
</html>
